name: Sync Metabase data

on:
  # 2026-08-30: GitHub's own `schedule:` trigger is only best-effort — the :00/:15/:30/:45-offset
  # fix above got this from 8-11h real gaps down to *only* 2-5.5h real gaps (checked via the Actions
  # API), still nowhere near the intended 15min. This is a documented platform limitation for
  # sub-hourly schedules, not something fixable by further tweaking the cron string, so the
  # `schedule:` trigger has been dropped entirely. Cadence is now driven externally: a free
  # cron-job.org job calls this workflow's `workflow_dispatch` REST endpoint (a direct API call,
  # not subject to GitHub's internal scheduler queue) — every 1h as of 2026-08-31 (was ~14min
  # until then, reduced to cut Actions minutes usage) — see data/live/README.md for the exact
  # request cron-job.org is configured with.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 2026-11-10: Supabase free tier pauses the project after 7 days without traffic (happened
      # 2026-11-02, broke every Supabase-backed form of the app). One tiny read per hourly run keeps
      # it active. Uses the public publishable key already shipped in index.html; never fails the job.
      - name: Keep Supabase project awake
        run: |
          curl -s -m 20 -o /dev/null -w "Supabase ping: HTTP %{http_code}\n" \
            "https://vyzzvawfqdcfuwkofnuu.supabase.co/rest/v1/pff_symbol_map?select=sym&limit=1" \
            -H "apikey: sb_publishable_mtZtn8RevTY7DmZA83WK0A_GN2N8pJ8" || true

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install

      - run: npm run sync-metabase
        env:
          METABASE_API_TOKEN: ${{ secrets.METABASE_API_TOKEN }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Sync data from Metabase"
            # 2026-11-19: a code push landing between checkout and push made the 01:00 run fail
            # (non-fast-forward). This job only touches data/, so rebasing onto the new main is safe;
            # retry a few times in case another push lands meanwhile.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              sleep 5
            done
            exit 1
          fi
